<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Animated neon technology stack</title><desc id="desc">Five motion-aware panels show programming languages, data engineering, AI, cloud platforms, applications and delivery tools.</desc>
<defs><linearGradient id="scan"><stop stop-color="#0CF0FF" stop-opacity="0"/><stop offset=".5" stop-color="#BF6BFF" stop-opacity=".65"/><stop offset="1" stop-color="#0CF0FF" stop-opacity="0"/></linearGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#5A7198" stroke-opacity=".08"/></pattern></defs>
<style>
.panel{animation:rise 7s ease-in-out infinite}.panel:nth-of-type(3){animation-delay:-1s}.panel:nth-of-type(4){animation-delay:-2s}.panel:nth-of-type(5){animation-delay:-3s}.panel:nth-of-type(6){animation-delay:-4s}
.aura{animation:breath 3.8s ease-in-out infinite}.dot{animation:blink 2s ease-in-out infinite}
.head{font:800 15px Lato,Arial,sans-serif;letter-spacing:1.2px;fill:#ECF4FF}.tag{font:700 12px Lato,Arial,sans-serif;fill:#C5D4EA}
@keyframes rise{50%{transform:translateY(-2px)}}@keyframes breath{50%{stroke-opacity:.7}}@keyframes blink{50%{opacity:.38}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
