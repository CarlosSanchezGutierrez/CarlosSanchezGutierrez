      <text x="49" y="94" fill="#63d48d" font-family="Arial,sans-serif" font-size="17" font-weight="800" letter-spacing="1">HEINEKEN</text>
    </g>
    <g class="word" transform="translate(398 0)">
      <circle cx="23" cy="88" r="17" fill="#4d89ff" fill-opacity=".16" stroke="#4d89ff" stroke-opacity=".54"/><path d="M15 83h16M15 88h12M15 93h9" stroke="#8eb1ff" stroke-width="2"/>
      <text x="49" y="94" fill="#8eb1ff" font-family="Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="1.1">CEMEX</text>
