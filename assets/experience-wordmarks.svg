<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="152" viewBox="0 0 1200 152" role="img" aria-labelledby="title desc">
<title id="title">Animated experience wordmarks</title>
<desc id="desc">A subtle horizontal loop featuring Tec de Monterrey, HEINEKEN, CEMEX, FEMSA, Santander, IEEE and Cruz Roja.</desc>
<defs>
  <linearGradient id="fade"><stop stop-color="#0b0e14" stop-opacity="1"/><stop offset=".12" stop-color="#0b0e14" stop-opacity="0"/><stop offset=".88" stop-color="#0b0e14" stop-opacity="0"/><stop offset="1" stop-color="#0b0e14" stop-opacity="1"/></linearGradient>
</defs>
<style>
  .track{animation:scroll 28s linear infinite}
  .word{animation:glow 5s ease-in-out infinite}
  .word:nth-child(2){animation-delay:-1s}.word:nth-child(3){animation-delay:-2s}.word:nth-child(4){animation-delay:-3s}
  @keyframes scroll{to{transform:translateX(-1040px)}}
  @keyframes glow{50%{opacity:.62}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
<rect width="1200" height="152" rx="19" fill="#0b0e14"/>
<rect x=".5" y=".5" width="1199" height="151" rx="18.5" fill="none" stroke="#d3ddf2" stroke-opacity=".12"/>
<text x="29" y="30" fill="#77839a" font-family="monospace" font-size="10" letter-spacing="2">EXPERIENCE · RESEARCH · BUILDING IN PUBLIC</text>
<clipPath id="window"><rect x="15" y="42" width="1170" height="92" rx="8"/></clipPath>
<g clip-path="url(#window)">
