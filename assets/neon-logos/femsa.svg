<svg xmlns="http://www.w3.org/2000/svg" width="340" height="112" viewBox="0 0 340 112" role="img" aria-labelledby="title desc">
<title id="title">FEMSA official logo with animated neon frame</title><desc id="desc">The original FEMSA logo is preserved inside a custom animated neon frame.</desc>
<defs><linearGradient id="edge"><stop stop-color="#14ECFF"/><stop offset=".5" stop-color="#6D78FF"/><stop offset="1" stop-color="#F04BC7"/></linearGradient><filter id="glow" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="scan"><stop stop-color="#20F4FF" stop-opacity="0"/><stop offset=".5" stop-color="#20F4FF" stop-opacity=".5"/><stop offset="1" stop-color="#20F4FF" stop-opacity="0"/></linearGradient></defs>
<style>.frame{animation:ignite 3.6s ease-in-out infinite}.halo{animation:breathe 4s ease-in-out infinite}.beam{animation:pass 5.5s ease-in-out infinite}.word{font:900 20px Lato,Arial,sans-serif;letter-spacing:1px;fill:#f4f7ff}.sub{font:700 8px Lato,Arial,sans-serif;letter-spacing:1.5px;fill:#8c9bb2}
@keyframes ignite{0%,100%{stroke-opacity:.42}50%{stroke-opacity:1;filter:url(#glow)}}@keyframes breathe{50%{opacity:.52}}@keyframes pass{0%{transform:translateX(-380px)}100%{transform:translateX(380px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}</style>
<rect x="1" y="1" width="338" height="110" rx="17" fill="#090D18" stroke="url(#edge)" stroke-width="2.2" class="frame"/>
<rect x="7" y="7" width="326" height="98" rx="13" fill="#35E6FF" opacity=".1" class="halo"/>
<rect x="18" y="20" width="304" height="72" rx="10" fill="#F7F9FC" stroke="#ffffff" stroke-opacity=".8"/>
<image href="data:image/svg+xml;base64," x="27" y="23" width="286" height="66" preserveAspectRatio="xMidYMid meet"/>
<path class="beam" d="M0 13h42l48 86H86z" fill="url(#scan)" opacity=".45"/>
</svg>